name: check

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
        
      - name: setup-zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: lint
        run: |
          zig fmt --check src/ build.zig

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runs-on: ubuntu-latest
          - os: windows-latest
            runs-on: [self-hosted, ghr-base-win]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: setup-zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: test
        run: |
          zig build --release=fast test

      - name: test C-API-only static
        run: |
          zig build --release=fast -Denable_c_api_static=true

      - name: test C-API-only shared (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          zig build --release=fast -Denable_c_api_shared=true

      - name: test with snappy (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build --release=fast -Denable_snappy=true test
