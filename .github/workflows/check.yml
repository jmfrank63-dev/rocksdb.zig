name: check

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
        
      - name: setup-zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: lint
        run: |
          zig fmt --check src/ build.zig

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{matrix.os}}
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: setup-zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: test
        run: |
          zig build --release=fast test

      - name: test C-API-only static
        run: |
          zig build --release=fast -Denable_c_api_static=true

      - name: test C-API-only shared (Windows)
        if: runner.os == 'Windows'
        run: |
          zig build --release=fast -Denable_c_api_shared=true

      - name: test with snappy (Linux)
        if: runner.os == 'Linux'
        run: |
          zig build --release=fast -Denable_snappy=true test
